name: CI/CD Hola Docker

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build imagen Docker
        run: docker build -t acxell/hola-docker:latest .

      - name: Push a Docker Hub
        run: docker push acxell/hola-docker:latest

      - name: Deploy automático en Render
        run: |
          curl -X POST "https://api.render.com/deploy/srv-d76ogu6dqaus73b0ldr0?key=${{ secrets.RENDER_API_KEY }}"